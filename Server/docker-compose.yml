# 원격 서버 — 게임 서버 + 경매장. Server/에서 `docker compose up -d --build`. 설명: Server/docs/도커.md
# 개발 값(게임 10050 · 경매장 10060)은 각 서버의 appsettings.json에 있고, 원격에서 다른 값만 여기 environment로 덮는다.
# 원격 포트(30329 · 30330)가 개발과 달라 같은 PC에서 개발 서버와 함께 떠도 겹치지 않는다.
name: wsgame

services:
  game:
    build:
      context: .
      dockerfile: WSGameServer/Dockerfile
    ports:
      - "30329:30329"                                   # 친구들이 붙는 포트 — 공유기도 같은 번호로 넘긴다
    environment:
      Game__ListenPort: "30329"
      Game__DbPath: /data/game.sqlite3                  # 볼륨. 없으면 빈 DB를 만들고 마이그레이션이 채운다
      Game__Auction__Address: http://auction:30330      # 컨테이너 안의 127.0.0.1은 게임 컨테이너 자신이다
      Game__CheatAdminLevel: "1"                        # 원격은 admin_level 1 이상만 치트
      TZ: Asia/Seoul                                    # 로그 시각
    volumes:
      - game-data:/data
    depends_on:
      - auction
    restart: unless-stopped                             # PC를 켜면(Docker Desktop 자동 실행) 같이 뜬다

  auction:
    build:
      context: .
      dockerfile: AuctionServer/Dockerfile
    ports:
      - "127.0.0.1:30330:30330"                         # 이 PC에서만. 외부 노출은 T-110
    environment:
      Auction__ListenPort: "30330"
      Auction__ListenAddress: 0.0.0.0                   # 컨테이너 밖(게임 컨테이너·이 PC)에서 받으려면 모든 인터페이스
      Auction__DbPath: /data/auction.sqlite3
      TZ: Asia/Seoul
    volumes:
      - auction-data:/data
    restart: unless-stopped

volumes:
  game-data:
  auction-data:
