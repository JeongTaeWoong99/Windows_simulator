# 문서 사이트 배포 — GameDesign/web(Astro) → Cloudflare Pages
#
# Cloudflare의 Git 연동을 쓰지 않고 여기서 빌드해 wrangler로 올린다.
# 저장소 소유자가 아니면 Cloudflare GitHub App을 설치할 수 없어 Git 연동이 막히기 때문이다.
# 이 방식은 누가 push하든(소유자·협업자 무관) 똑같이 배포된다.
#
# ⚠️ 선행 조건: 시크릿 CLOUDFLARE_API_TOKEN · CLOUDFLARE_ACCOUNT_ID 가 등록돼 있어야 하고,
#    Cloudflare 대시보드에 아래 PROJECT_NAME 과 같은 이름의 Pages 프로젝트가 미리 있어야 한다.
#    (wrangler는 없는 프로젝트를 CI에서 만들지 못한다)
#    시크릿이 없으면 빌드까지만 하고 배포를 건너뛴다 — 시크릿을 넣기 전까지
#    push마다 빨간 X가 뜨면 CI 신호 자체가 무의미해지기 때문이다.
name: 문서 사이트 배포

on:
  push:
    branches: [main]
    paths:
      # 사이트는 web/ 밖의 원본을 그대로 읽는다. 문서가 바뀌어도 다시 빌드해야 한다.
      - 'GameDesign/web/**'
      - 'GameDesign/design/**'
      - 'tasks/**'
      - '.github/workflows/docs-deploy.yml'
  pull_request:
    paths:
      - 'GameDesign/web/**'
      - 'GameDesign/design/**'
      - 'tasks/**'
      - '.github/workflows/docs-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECT_NAME: wsdocs
  WEB_DIR: GameDesign/web

jobs:
  deploy:
    name: 빌드 · 배포
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: GameDesign/web/package-lock.json

      # package-lock.json 그대로 설치한다(npm install이 아니다) — CI에서 의존성이 조용히 바뀌지 않게.
      - name: 의존성 설치
        working-directory: ${{ env.WEB_DIR }}
        run: npm ci

      # prebuild(sync-assets.mjs)가 목업·이미지를 public/assets로 복사한 뒤 astro build가 돈다.
      - name: 빌드
        working-directory: ${{ env.WEB_DIR }}
        run: npm run build

      # 시크릿을 run에 직접 펼치지 않는다(로그 노출). env로 넘겨 존재 여부만 본다.
      - name: 배포 시크릿 확인
        id: guard
        env:
          TOKEN:   ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_API_TOKEN/ACCOUNT_ID 시크릿이 없어 배포를 건너뜁니다(빌드는 통과)."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # PR에서는 빌드까지만 한다 — 깨진 문서를 미리 잡되, 배포는 main에서만 일어난다.
      # (fork PR에는 시크릿이 내려오지 않아 어차피 배포할 수 없다)
      - name: Cloudflare Pages 배포
        if: github.event_name != 'pull_request' && steps.guard.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ${{ env.WEB_DIR }}
          command: pages deploy dist --project-name=${{ env.PROJECT_NAME }} --branch=main
