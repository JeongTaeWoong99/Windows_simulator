# 문서 사이트 배포 — GameDesign/web(Astro) → Cloudflare Pages
#
# Cloudflare의 Git 연동을 쓰지 않고 여기서 빌드해 wrangler로 올린다.
# 저장소 소유자가 아니면 Cloudflare GitHub App을 설치할 수 없어 Git 연동이 막히기 때문이다.
# 이 방식은 누가 push하든(소유자·협업자 무관) 똑같이 배포된다.
#
# ⚠️ 선행 조건: 시크릿 CLOUDFLARE_API_TOKEN · CLOUDFLARE_ACCOUNT_ID 가 등록돼 있어야 하고,
#    Cloudflare 대시보드에 아래 PROJECT_NAME 과 같은 이름의 Pages 프로젝트가 미리 있어야 한다.
#    (wrangler는 없는 프로젝트를 CI에서 만들지 못한다)
#    시크릿이 없으면 빌드까지만 하고 배포를 건너뛴다 — 시크릿을 넣기 전까지
#    push마다 빨간 X가 뜨면 CI 신호 자체가 무의미해지기 때문이다.
name: 문서 사이트 배포

on:
  push:
    branches: [main]
    paths:
      # 사이트는 web/ 밖의 원본을 그대로 읽는다. 문서가 바뀌어도 다시 빌드해야 한다.
      - 'GameDesign/web/**'
      - 'GameDesign/design/**'
      - 'GameDesign/DataLog/**'
      - 'tasks/**'
      - '.github/workflows/docs-deploy.yml'
  pull_request:
    paths:
      - 'GameDesign/web/**'
      - 'GameDesign/design/**'
      - 'GameDesign/DataLog/**'
      - 'tasks/**'
      - '.github/workflows/docs-deploy.yml'
  workflow_dispatch:
  # 회차가 넘어가는 일요일 09:00(KST) — 문서가 안 바뀌어도 지난 회차 일감을 밀고 탭을 갈아 끼운다.
  schedule:
    - cron: '0 0 * * 0'

# 회차 자동 이월이 일감 커밋을 push하고(contents) 이슈 마일스톤을 옮긴다(issues).
permissions:
  contents: write
  issues: write

env:
  PROJECT_NAME: wsdocs
  WEB_DIR: GameDesign/web

jobs:
  deploy:
    name: 빌드 · 배포
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 지난 회차를 목표로 둔 미완료 일감 → 이번 회차 · 지난 회차 마일스톤의 열린 이슈도 옮기고 마일스톤은 닫는다.
      # PR은 건너뛴다(main에만 반영). 이 job이 고친 파일로 바로 빌드하므로 사이트에도 곧장 반영된다.
      # GITHUB_TOKEN으로 한 push는 워크플로를 다시 깨우지 않는다 — 배포가 두 번 돌지 않는다.
      - name: 회차 자동 이월
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node GameDesign/web/scripts/roll-cycles.mjs --issues
          if git diff --quiet -- tasks; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tasks
          git commit -m 'chore: 지난 회차 미완료 일감을 다음 회차로 민다 (자동)'
          # 그사이 main이 움직였으면 위에 얹는다. 실패해도 배포는 계속한다 — 다음 실행이 다시 민다.
          git pull --rebase origin main && git push origin HEAD:main || echo "::warning::이월 커밋 push 실패 — 다음 실행에서 다시 시도한다"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: GameDesign/web/package-lock.json

      # package-lock.json 그대로 설치한다(npm install이 아니다) — CI에서 의존성이 조용히 바뀌지 않게.
      - name: 의존성 설치
        working-directory: ${{ env.WEB_DIR }}
        run: npm ci

      # prebuild(sync-assets.mjs)가 목업·이미지를 public/assets로 복사한 뒤 astro build가 돈다.
      - name: 빌드
        working-directory: ${{ env.WEB_DIR }}
        run: npm run build

      # 시크릿을 run에 직접 펼치지 않는다(로그 노출). env로 넘겨 존재 여부만 본다.
      - name: 배포 시크릿 확인
        id: guard
        env:
          TOKEN:   ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_API_TOKEN/ACCOUNT_ID 시크릿이 없어 배포를 건너뜁니다(빌드는 통과)."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # PR에서는 빌드까지만 한다 — 깨진 문서를 미리 잡되, 배포는 main에서만 일어난다.
      # (fork PR에는 시크릿이 내려오지 않아 어차피 배포할 수 없다)
      - name: Cloudflare Pages 배포
        if: github.event_name != 'pull_request' && steps.guard.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ${{ env.WEB_DIR }}
          command: pages deploy dist --project-name=${{ env.PROJECT_NAME }} --branch=main

      # 깨졌을 때만 알린다. 통과·취소에는 울리지 않는다.
      - name: 실패 알림
        if: failure()
        uses: ./.github/actions/discord-notify
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
