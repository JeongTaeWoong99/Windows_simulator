# CI 결과 Discord 알림 — 상태가 바뀔 때만 울린다.
#
# 각 워크플로에 알림 스텝을 넣지 않고 workflow_run으로 뒤에서 듣는다.
# 감시 대상이 늘어도 이 파일의 workflows 목록 한 줄만 고치면 되고,
# CI 워크플로 쪽에는 알림 코드가 섞이지 않는다.
#
# ⚠️ 선행 조건: 시크릿 DISCORD_WEBHOOK 이 등록돼 있어야 한다.
#    (Discord 채널 → 설정 → 연동 → 웹후크 → 웹후크 URL 복사)
#    없으면 경고만 남기고 조용히 끝난다.
#
# ⚠️ workflow_run은 **기본 브랜치(main)에 있는 파일**만 실행된다.
#    브랜치에서 이 파일을 고쳐도 머지 전에는 동작을 확인할 수 없다.
name: CI 알림

on:
  workflow_run:
    # 워크플로 파일의 name: 과 정확히 같아야 한다. 이름을 바꾸면 여기도 바꾼다.
    workflows: ['클라이언트 CI', '서버 CI', '문서 사이트 배포']
    types: [completed]

permissions:
  contents: read
  actions: read        # 직전 실행 결과를 조회한다

jobs:
  notify:
    name: Discord 알림
    runs-on: ubuntu-latest

    steps:
      - name: 상태 변화 판정 후 전송
        uses: actions/github-script@v7
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        with:
          script: |
            const webhook = process.env.WEBHOOK;
            if (!webhook) {
              core.warning('DISCORD_WEBHOOK 시크릿이 없어 알림을 건너뜁니다.');
              return;
            }

            const run    = context.payload.workflow_run;
            const FAILED = ['failure', 'timed_out'];

            // 취소·건너뜀은 고장이 아니다. 알리면 소음만 된다.
            if (!FAILED.includes(run.conclusion) && run.conclusion !== 'success') {
              core.info(`알림 대상이 아닌 결과입니다: ${run.conclusion}`);
              return;
            }

            // 직전 실행을 찾는다 — 같은 워크플로·브랜치·이벤트여야 비교가 성립한다.
            // (push와 pull_request를 섞으면 남의 결과를 보고 판정한다)
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner:       context.repo.owner,
              repo:        context.repo.repo,
              workflow_id: run.workflow_id,
              branch:      run.head_branch,
              event:       run.event,
              status:      'completed',
              per_page:    10,
            });
            const prev = data.workflow_runs.find(r => r.run_number < run.run_number);
            const prevFailed = prev ? FAILED.includes(prev.conclusion) : false;

            // 핵심 규칙: **상태가 바뀔 때만** 보낸다.
            // 계속 실패 중인 것을 매번 알리면 알림을 끄게 되고, 그러면 진짜 고장도 놓친다.
            const broke     = FAILED.includes(run.conclusion) && !prevFailed;
            const recovered = run.conclusion === 'success' && prevFailed;
            if (!broke && !recovered) {
              core.info(`상태 그대로라 조용히 넘어갑니다 (직전: ${prev ? prev.conclusion : '없음'} → 지금: ${run.conclusion})`);
              return;
            }

            const commit  = run.head_commit;
            const subject = commit ? commit.message.split('\n')[0] : '(커밋 정보 없음)';
            const sha     = run.head_sha.slice(0, 7);

            const payload = {
              embeds: [{
                title:       `${broke ? '❌ 실패' : '✅ 복구'} — ${run.name}`,
                url:         run.html_url,
                color:       broke ? 0xE03131 : 0x2F9E44,
                description: `\`${sha}\` ${subject}`,
                fields: [
                  { name: '브랜치', value: run.head_branch,              inline: true },
                  { name: '실행',   value: run.event,                    inline: true },
                  { name: '작성자', value: run.actor?.login ?? '알 수 없음', inline: true },
                ],
                timestamp: run.updated_at,
              }],
            };

            const res = await fetch(webhook, {
              method:  'POST',
              headers: { 'content-type': 'application/json' },
              body:    JSON.stringify(payload),
            });
            // 실패를 삼키면 "알림이 안 오는 게 정상인지 고장인지" 구분할 수 없게 된다.
            if (!res.ok) {
              core.setFailed(`Discord 전송 실패: ${res.status} ${await res.text()}`);
            }
