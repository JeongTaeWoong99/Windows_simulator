# 일감 정합성 검사 — tasks/ 목록·파일·링크가 서로 어긋났는지 본다 (T-129)
#
# 검사 본체는 GameDesign/web/scripts/check-tasks.mjs — 로컬에서도 똑같이 돌린다.
# 어긋남이 있으면 빨간 X + Discord 알림만 낸다. 문서 사이트 배포(docs-deploy.yml)와 job을 나눠
# 일감 목록이 어긋나도 배포는 막지 않는다.
name: 일감 정합성 검사

on:
  push:
    branches: [main]
    paths:
      # 옛 경로 링크는 저장소 어느 문서에서나 생긴다 — .md 전부를 본다.
      - '**.md'
      - 'GameDesign/web/scripts/check-tasks.mjs'
      - '.github/workflows/tasks-check.yml'
  pull_request:
    paths:
      - '**.md'
      - 'GameDesign/web/scripts/check-tasks.mjs'
      - '.github/workflows/tasks-check.yml'
  # 이슈는 push 없이 닫힌다 — 닫히는 순간 그 이슈를 기다리는 ⏸이 남았는지 본다.
  issues:
    types: [closed]
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  sync-index:
    name: INDEX 갱신
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.sync.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 상태와 보관 건수 갱신
        id: sync
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            # 다른 머지나 회차 이월이 먼저 올라오면 최신 main에서 다시 계산한다.
            git fetch origin main
            git checkout --detach FETCH_HEAD
            node GameDesign/web/scripts/check-tasks.mjs --sync-index
            if git diff --quiet -- tasks/README.md; then
              printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git add tasks/README.md
            git commit -m 'chore: 일감 INDEX 상태와 보관 건수를 맞춘다'
            if git push origin HEAD:main; then
              printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "::error::최신 main의 일감 INDEX를 푸시하지 못했습니다"
          exit 1

  check:
    name: 검사
    needs: sync-index
    if: ${{ !cancelled() && (needs.sync-index.result == 'success' || needs.sync-index.result == 'skipped') }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.sync-index.outputs.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 닫힌 이슈 목록은 gh로 읽는다 — 러너에 gh가 깔려 있고 GH_TOKEN만 넘기면 된다.
      - name: 일감 정합성 검사
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # PR에서는 INDEX를 고치지 않는다(머지 뒤에 맞춘다) — INDEX 쪽 검사를 건너뛴다
        run: node GameDesign/web/scripts/check-tasks.mjs ${{ github.event_name == 'pull_request' && '--pr' || '' }}

      # 깨졌을 때만 알린다. 통과·취소에는 울리지 않는다.
      - name: 실패 알림
        if: failure()
        uses: ./.github/actions/discord-notify
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
